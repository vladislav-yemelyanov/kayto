[package]
name = "kayto"
version = "0.1.17"
edition = "2024"
description = "Fast OpenAPI parser that turns imperfect specs into a stable output schema with actionable diagnostics."
license = "MIT"
repository = "https://github.com/vladislav-yemelyanov/kayto"
readme = "README.md"
exclude = ["releases/**"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rootcause = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.2"
tokio = { version = "1.48.0", features = ["full"] }
